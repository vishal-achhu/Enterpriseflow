server:
  port: 8080
spring:
  application:
    name: enterpriseflow-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterpriseflow}
    username: ${SPRING_DATASOURCE_USERNAME:enterpriseflow}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-long-random-secret-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  analytics:
    base-url: ${ANALYTICS_BASE_URL:http://localhost:8000}
  soap:
    wsdl-url: ${SOAP_PARTNER_WSDL_URL:}
